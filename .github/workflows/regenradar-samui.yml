# Baut die Android-App "Regenradar Samui" (Ordner regenradar-samui/) als APK.
# Läuft nur, wenn sich diese App ändert.
name: Android Regenradar-Samui APK

on:
  push:
    paths:
      - "regenradar-samui/**"
      - ".github/workflows/regenradar-samui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: regenradar-samui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk Regenradar-Samui.apk
      - uses: actions/upload-artifact@v4
        with:
          name: regenradar-samui-apk
          path: regenradar-samui/app/build/outputs/apk/debug/app-debug.apk
      # Öffentlicher Download-Link (auch direkt vom Handy aus)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: regenradar-samui-latest
          name: Regenradar Samui (Android)
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: "APK auf dem Handy herunterladen und installieren (Installation aus unbekannten Quellen erlauben)."
          files: regenradar-samui/Regenradar-Samui.apk
